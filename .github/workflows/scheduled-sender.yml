name: Scheduled sender

on:
  schedule:
    # Every 15 minutes. GitHub may delay by a few minutes when busy.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # allow manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: scheduled-sender
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          pip install --quiet \
            google-api-python-client>=2.120 \
            google-auth-httplib2>=0.2 \
            google-auth-oauthlib>=1.2 \
            gspread>=6.0

      - name: Run scheduler
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          GSHEETS_SHEET_ID: ${{ secrets.GSHEETS_SHEET_ID }}
        run: python scheduler_runner.py
